[project]
name = "ability-scaffold"
version = "1.2.0"
description = "AbilityFramework 能力工程脚手架 + 打包工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
ability-scaffold = "ability_scaffold.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ability_scaffold = ["templates/**/*"]
