name: Windows Ability launcher
on:
  push:
    branches: [main, feat/windows-launcher]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Build native launcher with static CRT
        run: cl /nologo /std:c++20 /EHsc /MT /O2 /utf-8 native/windows/ability.cpp /Fe:ability.exe /link shell32.lib
      - name: Test real Windows Python child lifecycle
        run: python native/windows/test_launcher.py ability.exe
      - name: Install wheel and test native package creation
        run: |
          python -m pip wheel --no-deps . -w dist
          if ($LASTEXITCODE -ne 0) { throw 'Wheel build failed' }
          python -m pip install (Get-ChildItem dist/*.whl).FullName 'PyYAML==6.0.2'
          if ($LASTEXITCODE -ne 0) { throw 'Wheel install failed' }
          python native/windows/test_pack.py ability.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native package test failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ability-launcher-windows-amd64
          path: ability.exe
          if-no-files-found: error
